name: Monthly database backup

# Saves a restorable snapshot into backups/YYYY-MM-DD and commits it on this repo.
# Run manually and choose "restore" to put a snapshot back into Supabase.
on:
  schedule:
    # 1st of every month, 06:00 UTC (11:30 IST)
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: backup saves a new snapshot. restore puts a snapshot back into Supabase.
        type: choice
        required: true
        default: backup
        options:
          - backup
          - restore
      backup_date:
        description: Restore only. Folder date YYYY-MM-DD. Leave blank to use the latest backup.
        required: false
        type: string
      confirm:
        description: Restore only. Type restore to replace the live tables with the backup.
        required: false
        type: string

jobs:
  backup:
    if: github.event_name == 'schedule' || inputs.mode == 'backup'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dump database
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run backup
      - name: Commit backup to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups
          if git diff --cached --quiet; then
            echo "Backup matches what is already on GitHub."
          else
            git commit -m "Add Supabase backup for $(date -u +%Y-%m-%d)"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mukhtar-lab-backup-${{ github.run_id }}
          path: backups
          retention-days: 90

  restore:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'restore'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore the backup into Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONFIRM_RESTORE: ${{ inputs.confirm }}
          BACKUP_DATE: ${{ inputs.backup_date }}
        run: npm run restore
